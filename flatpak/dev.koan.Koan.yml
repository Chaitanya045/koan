# Flatpak of a Koan release build (out/Release), made by
# scripts/ci/linux_package.sh, which stages the browser into koan/ next to
# this file first. Not built from source here: like Flathub's
# com.google.Chrome, it wraps a ready Chromium binary, and runs it through
# cobalt (the launcher in org.chromium.Chromium.BaseApp) and zypak, which
# makes Chromium's sandbox work inside Flatpak's.
#
# finish-args follow com.google.Chrome's on Flathub (camera, FIDO keys,
# printing, notifications, keyrings, media keys, the usual XDG folders),
# without its dconf module for GNOME proxy settings; plus read-only access
# to the other browsers' folders, for the import.
app-id: dev.koan.Koan
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: koan
separate-locales: false
build-options:
  no-debuginfo: true
  strip: false
finish-args:
  - --require-version=1.8.2
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pcsc
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  # Import from other browsers (#493): read-only, exactly the folders
  # Koan looks for them in (koan_import_sources.cc, kept the same by
  # scripts/tests/test_flatpak_import_paths.py), and the Flatpak apps'
  # icons. Their passwords' keys come through org.freedesktop.secrets and
  # kwalletd5/6 above, which Koan has for its own key.
  - --filesystem=~/.zen:ro
  - --filesystem=~/.config/zen:ro
  - --filesystem=~/.var/app/app.zen_browser.zen/.zen:ro
  - --filesystem=~/.var/app/app.zen_browser.zen/config/zen:ro
  - --filesystem=~/.config/google-chrome:ro
  - --filesystem=~/.var/app/com.google.Chrome/config/google-chrome:ro
  - --filesystem=~/.config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/.config/microsoft-edge:ro
  - --filesystem=~/.var/app/com.microsoft.Edge/config/microsoft-edge:ro
  - --filesystem=~/.config/vivaldi:ro
  - --filesystem=~/.var/app/com.vivaldi.Vivaldi/config/vivaldi:ro
  - --filesystem=~/.config/chromium:ro
  - --filesystem=~/.var/app/org.chromium.Chromium/config/chromium:ro
  - --filesystem=~/.floorp:ro
  - --filesystem=~/.config/floorp:ro
  - --filesystem=~/.var/app/one.ablaze.floorp/.floorp:ro
  - --filesystem=~/.var/app/one.ablaze.floorp/config/floorp:ro
  - --filesystem=~/.librewolf:ro
  - --filesystem=~/.config/librewolf:ro
  - --filesystem=~/.var/app/io.gitlab.librewolf-community/.librewolf:ro
  - --filesystem=~/.var/app/io.gitlab.librewolf-community/config/librewolf:ro
  - --filesystem=~/.waterfox:ro
  - --filesystem=~/.config/waterfox:ro
  - --filesystem=~/.var/app/net.waterfox.waterfox/.waterfox:ro
  - --filesystem=~/.var/app/net.waterfox.waterfox/config/waterfox:ro
  - --filesystem=~/.config/mozilla/firefox:ro
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=~/snap/firefox/common/.mozilla/firefox:ro
  - --filesystem=~/.var/app/org.mozilla.firefox/.mozilla/firefox:ro
  - --filesystem=~/.var/app/org.mozilla.firefox/config/mozilla/firefox:ro
  - --filesystem=xdg-data/flatpak/exports/share/icons:ro
  - --filesystem=/var/lib/flatpak/exports/share/icons:ro
modules:
  # Same version as com.google.Chrome on Flathub.
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  - name: koan
    buildsystem: simple
    build-commands:
      - cp -a koan /app/koan
      # zypak starts the sandboxed processes itself; Chromium only checks
      # that a sandbox binary exists (com.google.Chrome does the same).
      - install -Dm 755 stub_sandbox.sh /app/koan/chrome-sandbox
      # Geist, which Koan registers from /app/koan/koan_fonts itself, also
      # in the runtime's font folder, so fc-match and the other processes
      # in the sandbox find it.
      - mkdir -p /app/share/fonts
      - ln -s ../../koan/koan_fonts /app/share/fonts/koan
      - install -Dm 755 koan.sh /app/bin/koan
      - install -Dm 644 -t /app/etc cobalt.ini
      - install -Dm 644 -t /app/share/applications dev.koan.Koan.desktop
      - install -Dm 644 -t /app/share/metainfo dev.koan.Koan.metainfo.xml
      - install -Dm 644 dev.koan.Koan.svg /app/share/icons/hicolor/scalable/apps/dev.koan.Koan.svg
      - for s in 64 128 256 512; do install -Dm 644 icon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/dev.koan.Koan.png; done
    sources:
      - type: dir
        path: koan
        dest: koan
      - type: script
        dest-filename: stub_sandbox.sh
        commands:
          - 'echo "Stub sandbox ignoring command: $@"'
          - exit 1
      - type: file
        path: koan.sh
      - type: file
        path: cobalt.ini
      - type: file
        path: dev.koan.Koan.desktop
      - type: file
        path: dev.koan.Koan.metainfo.xml
      - type: file
        path: dev.koan.Koan.svg
      - type: file
        path: icon-64.png
      - type: file
        path: icon-128.png
      - type: file
        path: icon-256.png
      - type: file
        path: icon-512.png
