[Application]
Name=koan
EntryPoint=/app/koan/chrome
WrapperScript=/app/bin/koan
# Unbranded Chromium's profile folder on Linux, under the sandbox's
# XDG_CONFIG_HOME (~/.var/app/dev.koan.Koan/config/chromium).
ConfigDir=chromium

[Zypak]
SandboxFilename=chrome-sandbox
# The Widevine CDM Chromium downloads into the profile.
ExposeWidevine=true

[DefaultFeatures]
Enabled=WebRTCPipeWireCapturer
