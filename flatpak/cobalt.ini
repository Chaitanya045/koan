[Application]
Name=koan
EntryPoint=/app/koan/chrome
WrapperScript=/app/bin/koan
# Koan's profile folder on Linux (the branding renames Chromium's), under
# the sandbox's XDG_CONFIG_HOME (~/.var/app/dev.koan.Koan/config/koan).
ConfigDir=koan

[Zypak]
SandboxFilename=chrome-sandbox
# The Widevine CDM Chromium downloads into the profile.
ExposeWidevine=true

[DefaultFeatures]
Enabled=WebRTCPipeWireCapturer
