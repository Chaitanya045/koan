<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Koan</title>
<link rel="stylesheet" href="/koan_welcome.css">
<script type="module" src="/koan_welcome.js"></script>
</head>
<body>
<video id="zen-welcome-video" autoplay loop muted disablepictureinpicture
       tabindex="-1" aria-hidden="true"></video>
<div id="zen-welcome" role="dialog" aria-modal="true"
     aria-label="Welcome to a calmer internet">
  <div id="zen-welcome-start">
    <h1 id="zen-welcome-title"></h1>
    <button class="footer-button primary" id="zen-welcome-start-button"
            aria-label="Start"></button>
  </div>
  <div id="zen-welcome-pages">
    <div id="zen-welcome-page-sidebar">
      <button id="zen-welcome-back"></button>
      <div id="zen-welcome-page-sidebar-content" aria-live="polite"></div>
      <div id="zen-welcome-page-sidebar-buttons"></div>
    </div>
    <div id="zen-welcome-page-content"></div>
  </div>
</div>
</body>
</html>
