<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Koan: an ensō (Zen brush circle) on a dark rounded square. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232037"/>
      <stop offset="1" stop-color="#16141f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c177"/>
      <stop offset="0.55" stop-color="#eb6f92"/>
      <stop offset="1" stop-color="#9ccfd8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <!-- Open circle: from -50deg the long way round to -15deg, centre (128,132). -->
  <path d="M 171.7 79.9 A 68 68 0 1 0 193.7 114.4" fill="none"
        stroke="url(#ink)" stroke-width="24" stroke-linecap="round"/>
</svg>
