# Koan releases: builds the arm64 Mac app of a v* tag and publishes it as a
# GitHub release with its notes. docs/RELEASING.md has the steps.
#
#   git tag v0.0.2-alpha.1 && git push origin v0.0.2-alpha.1
#   gh workflow run release.yml -f tag=v0.0.2-alpha.1 [-f draft=true]
#
# 1. prepare (minutes): the tag must be v<VERSION>, docs/releases/<VERSION>.md
#    must exist and be finished, the app's CFBundleVersion must go up from the
#    previous release's, and no release of the tag may exist yet
#    (scripts/ci/release_info.py). Anything else fails here, not a day later.
# 2. build (~16 h): the nightly's chain (macos-chain.yml: fetch, chained
#    macos-build.yml slices) on the tag's commit, with the nightly's dev
#    config (build/koan-mac.gn). An official ThinLTO + PGO build doesn't fit
#    GitHub's hosted 7 GB runners: docs/RELEASING.md, "Official builds".
# 3. publish: the .dmg and its .sha256; title "Koan <x.y.z> (<Label>) ·
#    Chromium <version>"; always a full release marked Latest, alphas too
#    (the "(Alpha)" in the title and the notes' warning carry the stage; only
#    the rolling Nightly is a GitHub pre-release, so /releases/latest and the
#    repository's sidebar always show the newest tagged release); the body is
#    the notes, then GitHub's generated notes since the previous release tag
#    (.github/release.yml sorts them by label). Published at once, or a draft
#    with draft=true.
#
# Signed ad hoc, as the nightly (no Developer ID yet).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (it must exist), e.g. v0.0.2-alpha.1
        required: true
        type: string
      draft:
        description: Keep the release as a draft
        required: false
        default: false
        type: boolean

permissions: {}

# One release at a time, never cancelled: a second one waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the tag, VERSION and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.info.outputs.version }}
      title: ${{ steps.info.outputs.title }}
      notes: ${{ steps.info.outputs.notes }}
      previous_tag: ${{ steps.info.outputs.previous_tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! $TAG =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "'$TAG' is not a release tag (v<version>)" >&2
            exit 1
          fi
          # The commit the tag points at (an annotated tag's too).
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "a release of $TAG exists already; delete it first to redo it" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          # Every tag, for the previous release's VERSION.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check
        id: info
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 -I scripts/ci/release_info.py check --tag "$TAG"
          {
            echo "### Releasing $TAG"
            echo
            sed 's/^/- /' "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/macos-chain.yml
    permissions:
      contents: read
      actions: write
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release: true
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The "release" environment (Settings > Environments) waits for the
    # owner's approval before anything is published, and only runs for v*
    # tags and develop (a tag push, or a dispatch from develop).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      TITLE: ${{ needs.prepare.outputs.title }}
      NOTES: ${{ needs.prepare.outputs.notes }}
      PREVIOUS: ${{ needs.prepare.outputs.previous_tag }}
      DRAFT: ${{ inputs.draft && 'true' || 'false' }}
      DMG: ${{ needs.build.outputs.dmg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.dmg }}
          path: dist

      - name: Checksum and notes
        run: |
          (cd dist && shasum -a 256 "$DMG" > "$DMG.sha256" && cat "$DMG.sha256")
          # GitHub's notes: the pull requests since the previous release tag
          # (never the rolling "nightly" tag), sorted by .github/release.yml.
          args=(-f "tag_name=$TAG" -f "target_commitish=$SHA")
          if [[ -n $PREVIOUS ]]; then args+=(-f "previous_tag_name=$PREVIOUS"); fi
          gh api "repos/$GH_REPO/releases/generate-notes" "${args[@]}" \
            --jq .body > "$RUNNER_TEMP/generated.md"
          python3 -I scripts/ci/release_info.py notes --notes "$NOTES" \
            --dmg "$DMG" --sha256 "$(cut -d' ' -f1 "dist/$DMG.sha256")" \
            --generated "$RUNNER_TEMP/generated.md" --output "$RUNNER_TEMP/body.md"

      - name: Publish
        run: |
          # Never --prerelease: see the top of this file.
          args=(--verify-tag --latest --title "$TITLE" --notes-file "$RUNNER_TEMP/body.md")
          if [[ $DRAFT == true ]]; then args+=(--draft); fi
          gh release create "$TAG" "dist/$DMG" "dist/$DMG.sha256" "${args[@]}"
          {
            echo "### $TITLE"
            echo
            echo "- $(gh release view "$TAG" --json url --jq .url)"
            echo "- \`$(cat "dist/$DMG.sha256")\`"
            [[ $DRAFT != true ]] || echo "- Draft: publish it from the release page"
          } >> "$GITHUB_STEP_SUMMARY"
