# The macOS (Apple Silicon) build chain, shared by the nightly (macos.yml)
# and releases (release.yml): fetch Chromium and apply Koan, then up to 16
# chained build jobs (macos-build.yml), each building for ~5 h and handing
# out/Koan on to the next; the job that finishes makes the .dmg, which stays
# an artifact of the run under the name in the "dmg" output. See
# .agent/notes/macos-ci.md.
#
# With incremental (the nightly), the fetch job starts from the newest
# successful develop run's tree and build 1 from its finished out/Koan, so
# only what changed since is rebuilt; releases always build from scratch.
# Only a keep_base run (develop built by develop, never unmerged code) leaves
# its source and out/Koan for later runs to build on.
#
# The caller decides whether to build, publishes the .dmg, and grants the
# jobs' permissions (contents: read; actions: write for the cleanup).
name: macOS build chain

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        type: string
      release:
        description: Name the .dmg Koan-<version>-arm64.dmg (no commit)
        required: false
        default: false
        type: boolean
      incremental:
        description: Build on the last trusted macos.yml run's tree and out/Koan when it can
        required: false
        default: false
        type: boolean
      keep_base:
        description: Keep this run's source and finished out/Koan as a base for later runs (only for a run of develop itself)
        required: false
        default: false
        type: boolean
    secrets:
      EVS_ACCOUNT_NAME:
        required: false
      EVS_PASSWD:
        required: false
    outputs:
      sha:
        description: The Koan commit built
        value: ${{ jobs.fetch.outputs.sha }}
      chromium:
        description: Its Chromium version (CHROMIUM_VERSION, line 1)
        value: ${{ jobs.fetch.outputs.chromium }}
      dmg:
        description: The disk image's artifact name
        value: ${{ jobs.check.outputs.dmg }}

permissions: {}

jobs:
  fetch:
    name: Fetch Chromium and apply Koan
    runs-on: xcode-27
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      chromium: ${{ steps.ref.outputs.chromium }}
      based_on: ${{ steps.fetch.outputs.based_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the commit
        id: ref
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "chromium=$(sed -n 1p CHROMIUM_VERSION)" >> "$GITHUB_OUTPUT"
          echo "Building Koan $sha on Chromium $(paste -sd' ' CHROMIUM_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the runner
        run: scripts/ci/mac_runner_setup.sh

      - name: Find a build to build on
        id: base
        if: inputs.incremental
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          BRANCH: develop
        run: scripts/ci/find_base.sh macos.yml koan-mac

      - name: Fetch Chromium, apply patches and branding, gn gen
        id: fetch
        env:
          KOAN_BASE_RUN: ${{ steps.base.outputs.base_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/ci/mac_fetch.sh
          based_on=$(sed -n 's/^based_on=//p' "$GITHUB_OUTPUT" | tail -1)
          if [[ -n $based_on ]]; then
            echo "Incremental: building on run $based_on" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full build" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Packaging only runs at the end of a run, a day or more later: check
      # codesign and hdiutil, ad hoc and with a throwaway certificate, on a
      # dummy app now.
      - name: Check the packaging
        run: |
          app="$RUNNER_TEMP/dummy/Koan.app"
          mkdir -p "$app/Contents/MacOS"
          cp /usr/bin/true "$app/Contents/MacOS/Koan"
          plutil -create xml1 "$app/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string Koan "$app/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string dev.koan.Koan.ci-check "$app/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$app/Contents/Info.plist"
          KOAN_CI_APP="$app" scripts/ci/mac_package.sh "$RUNNER_TEMP/dummy/dmg"
          # Releases sign with a certificate in a temporary keychain
          # (release.yml); check that part with a made-up one.
          trap 'scripts/ci/mac_codesign.sh teardown' EXIT
          out="$(scripts/ci/mac_codesign.sh setup --throwaway)"
          KOAN_CODESIGN_IDENTITY="$(printf '%s\n' "$out" | sed -n 's/^identity=//p')" \
            KOAN_CODESIGN_KEYCHAIN="$(printf '%s\n' "$out" | sed -n 's/^keychain=//p')" \
            KOAN_CI_APP="$app" scripts/ci/mac_package.sh "$RUNNER_TEMP/dummy/dmg-signed"
          rm -rf "$RUNNER_TEMP/dummy"

      - name: Pack the source
        run: |
          scripts/ci/mac_archive.sh pack-source "$RUNNER_TEMP/koan-mac-source.tar.zst"
          df -h /

      - name: Upload the source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/koan-mac-source.tar.zst
          archive: false
          overwrite: true
          # A keep_base run's next build builds on it.
          retention-days: ${{ inputs.keep_base && 14 || 3 }}
          if-no-files-found: error

  build-01:
    needs: [fetch]
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 1
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      base_run: ${{ needs.fetch.outputs.based_on }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-02:
    needs: [fetch, build-01]
    if: needs.build-01.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 2
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-03:
    needs: [fetch, build-02]
    if: needs.build-02.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 3
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-04:
    needs: [fetch, build-03]
    if: needs.build-03.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 4
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-05:
    needs: [fetch, build-04]
    if: needs.build-04.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 5
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-06:
    needs: [fetch, build-05]
    if: needs.build-05.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 6
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-07:
    needs: [fetch, build-06]
    if: needs.build-06.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 7
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-08:
    needs: [fetch, build-07]
    if: needs.build-07.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 8
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-09:
    needs: [fetch, build-08]
    if: needs.build-08.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 9
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-10:
    needs: [fetch, build-09]
    if: needs.build-09.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 10
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-11:
    needs: [fetch, build-10]
    if: needs.build-10.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 11
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-12:
    needs: [fetch, build-11]
    if: needs.build-11.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 12
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-13:
    needs: [fetch, build-12]
    if: needs.build-12.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 13
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-14:
    needs: [fetch, build-13]
    if: needs.build-13.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 14
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-15:
    needs: [fetch, build-14]
    if: needs.build-14.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 15
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  build-16:
    needs: [fetch, build-15]
    if: needs.build-15.outputs.status == 'running'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      slice: 16
      sha: ${{ needs.fetch.outputs.sha }}
      release: ${{ inputs.release }}
      incremental: ${{ inputs.incremental }}
      keep_base: ${{ inputs.keep_base }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  # Fails the run when a build job failed or the last one ran out of time
  # unfinished. Skipped with the chain (fork PRs, unchanged nightlies).
  check:
    name: Build finished
    needs: [fetch, build-01, build-02, build-03, build-04, build-05, build-06, build-07, build-08, build-09, build-10, build-11, build-12, build-13, build-14, build-15, build-16]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      dmg: ${{ steps.check.outputs.dmg }}
    steps:
      - name: Check
        id: check
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || needs.fetch.result != 'success' }}
          FINISHED: ${{ contains(needs.*.outputs.status, 'finished') }}
          DMG: ${{ join(needs.*.outputs.dmg, '') }}
        run: |
          if [[ $FAILED == true ]]; then
            echo "a build job failed; re-run the failed jobs to carry on" >&2
            exit 1
          fi
          if [[ $FINISHED != true ]]; then
            echo "not finished after 16 build jobs; add jobs to macos-chain.yml" >&2
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

  # A run that finished doesn't need its out/Koan hand-over archives any
  # more (a failed one keeps them, for "Re-run failed jobs", until they
  # expire: source 3 days, out 2). Its source goes too, unless it is a
  # keep_base run: its source and finished out/Koan stay for later runs to
  # build on, and the copies of older keep_base runs go. A run that is not
  # one only ever deletes its own archives. The .dmg and the logs stay.
  cleanup:
    name: Delete build archives
    needs: [check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.run_id }}
      KEEP_BASE: ${{ inputs.keep_base }}
    steps:
      - name: Delete
        run: |
          delete() {
            gh api --paginate "repos/$GH_REPO/actions/runs/$1/artifacts" \
              --jq ".artifacts[] | select(.name | test(\"$2\")) | \"\(.id) \(.name)\"" |
              while read -r id name; do
                echo "deleting $name of run $1"
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
              done
          }
          if [[ $KEEP_BASE != true ]]; then
            delete "$RUN" '^koan-mac-(source|out-)'
            exit 0
          fi
          delete "$RUN" '^koan-mac-out-[0-9]+[.]'
          # Older runs' bases go, but only runs that are over: a running
          # chain still needs its source. The list's status filter has
          # missed runs, so each run's own status decides.
          gh api "repos/$GH_REPO/actions/workflows/macos.yml/runs?per_page=50" --jq '.workflow_runs[].id' |
            while read -r id; do
              ((id < RUN)) || continue
              status="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status 2>/dev/null || true)"
              [[ $status == completed ]] || continue
              delete "$id" '^koan-mac-(source|out-final)[.]'
            done
