# Nightly macOS (Apple Silicon) build: Koan.app in an unsigned disk image,
# Koan-<version>-<sha>-arm64.dmg, kept as an artifact of the run and, for
# develop, as the rolling "nightly" pre-release.
#
# A first Chromium build takes far longer than GitHub's 6 h job limit on the
# free macOS runners (3 M1 cores, 7 GB RAM), so the build is chained: the
# fetch job checks out the pinned Chromium, applies Koan and uploads the
# tree; then up to 16 build jobs (macos-build.yml) each build for ~5 h and
# hand out/Koan on to the next as an artifact; the job that finishes makes
# the .dmg; the release job publishes it. The chain is macos-chain.yml,
# which release.yml (tagged releases) shares. See .agent/notes/macos-ci.md.
#
# Runs here are incremental: they start from the last successful run's
# tree and out/Koan and rebuild only what changed, so a full ~16 h build
# happens only for a new Chromium, branding or Xcode (or when no recent
# run is left to build on). Tagged releases always build from scratch.
#
# The plan job skips the whole chain for other labels, for forks, and for
# a nightly when nothing that goes into the app changed since the commit
# the "nightly" release was built from. Manual runs always build.
#
# Runs only when asked for: nightly, by hand from the Actions tab or with
#   gh workflow run macos.yml [-f ref=<branch, tag, commit or refs/pull/N/head>]
# or by adding the "macos-build" label to a pull request from this
# repository (a PR's head; workflow_dispatch only works once a workflow is
# on the default branch). Never on pushes: pull requests get only the cheap
# lint in ci.yml (actionlint, shellcheck).
name: macOS nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty for the branch you run it on)
        required: false
        default: ""
  # The "macos-build" label on a pull request builds its head once.
  pull_request:
    types: [labeled]

permissions: {}

# One build of a ref at a time: the nightly and a manual run of develop
# share macos-develop, a pull request's label runs share macos-pr-<number>.
# A run takes most of a day and is never cancelled; at most one more waits
# (a newer one replaces it). Other labels get a group of their own, so they
# never hold up or replace a build.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' && format('macos-{0}', inputs.ref || github.ref_name) ||
    github.event.label.name == 'macos-build' && format('macos-pr-{0}', github.event.pull_request.number) ||
    format('macos-label-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABEL: ${{ github.event.label.name }}
          SHA: ${{ github.sha }}
        run: |
          build=true
          if [[ $EVENT == pull_request && $LABEL != macos-build ]]; then
            build=false
          elif [[ $EVENT == pull_request && $HEAD_REPO != "$GH_REPO" ]]; then
            # A fork's PR would run its own scripts on 16 x 6 h of macOS
            # runners. A maintainer can build it by hand after review.
            echo "Pull request from $HEAD_REPO: not building." >> "$GITHUB_STEP_SUMMARY"
            build=false
          elif [[ $EVENT == schedule ]]; then
            # Skip when no file that goes into the app changed since the
            # commit the nightly release was built from. CHROMIUM_VERSION
            # is one of them, so a new Chromium pin always builds.
            old=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            if [[ -n $old ]] && cmp=$(gh api "repos/$GH_REPO/compare/$old...$SHA" \
                --jq '[.status, (.files | length)] | @tsv'); then
              read -r status count <<< "$cmp"
              changed=$(gh api "repos/$GH_REPO/compare/$old...$SHA" --jq '.files[].filename' |
                grep -E '^(src/|patches/|branding/|build/|scripts/|CHROMIUM_VERSION$|VERSION$|\.github/workflows/macos)' || true)
              # The compare API lists at most 300 files: build then.
              if [[ ($status == identical || $status == ahead) && $count -lt 300 && -z $changed ]]; then
                echo "Nothing that goes into the app changed since the nightly (${old:0:7}): not building." >> "$GITHUB_STEP_SUMMARY"
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/macos-chain.yml
    permissions:
      contents: read
      actions: write
    with:
      # A labelled pull request builds its head, not the merge commit.
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      # Rebuild only what changed since the last successful run.
      incremental: true
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

  release:
    name: Update the nightly pre-release
    needs: [build]
    # develop only: nightly runs, and manual runs on develop.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' &&
      (inputs.ref == '' || inputs.ref == 'develop' || inputs.ref == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Belt and braces: never two release updates at once.
    concurrency:
      group: macos-nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.build.outputs.sha }}
      CHROMIUM: ${{ needs.build.outputs.chromium }}
      DMG: ${{ needs.build.outputs.dmg }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DMG }}
          path: dist

      - name: Publish
        run: |
          cd dist
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat > notes.md <<EOF
          Koan for macOS on Apple Silicon, built from develop at $SHA
          (Chromium $CHROMIUM) by [this run]($RUN_URL). Replaced by every
          nightly build.

          The app is not signed with a Developer ID or notarised, so macOS
          blocks it the first time ("Apple could not verify 'Koan' is free
          of malware"). After copying it to Applications, run
          \`xattr -dr com.apple.quarantine /Applications/Koan.app\`, or
          use System Settings → Privacy & Security → Open Anyway. See
          [Installing the macOS build](https://github.com/$GH_REPO/blob/develop/docs/USAGE.md#installing-the-macos-build).

          SHA-256: \`$(cut -d' ' -f1 "$DMG.sha256")\`
          EOF
          # A new tag each time: delete the old release and its tag, then
          # make them again at this commit.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "$DMG" "$DMG.sha256" \
            --target "$SHA" --prerelease --latest=false \
            --title "Nightly ($(date -u +%Y-%m-%d), ${SHA:0:7})" --notes-file notes.md
