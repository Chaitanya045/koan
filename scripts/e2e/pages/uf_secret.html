<!doctype html>
<meta charset="utf-8">
<title>Checkout</title>
<!-- The user flows' secret fields (scripts/mac/video/flows/uf_resume.mjs and
     uf_autofill.mjs): a plain field, a password field and a card number field
     (autocomplete=cc-number), at fixed places so a real click can find them,
     and a sign-in form whose action is on this site. Focus in the password or
     the card field holds an agent's pause until Hand back (#408). -->
<style>
  body { margin: 0; font: 16px -apple-system, sans-serif; background: #fff; color: #18181b; }
  .f { position: absolute; left: 40px; width: 320px; height: 36px; font: inherit; padding: 0 8px;
       box-sizing: border-box; }
  .l { position: absolute; left: 40px; font-size: 14px; color: #52525b; }
</style>
<h1 style="margin:24px 40px">Checkout</h1>
<form id=login action="/p" method=post>
  <span class=l style="top:84px">Name</span>
  <input class=f id=name name=user autocomplete=username aria-label="Name" style="top:104px">
  <span class=l style="top:154px">Password</span>
  <input class=f id=pass type=password name=pass autocomplete=current-password aria-label="Password"
         style="top:174px">
  <span class=l style="top:224px">Card number</span>
  <input class=f id=card name=card autocomplete=cc-number inputmode=numeric aria-label="Card number"
         style="top:244px">
  <button id=go style="position:absolute;left:40px;top:300px;font:inherit">Continue</button>
</form>
