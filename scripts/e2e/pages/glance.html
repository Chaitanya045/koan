<!doctype html>
<title>Glance e2e</title>
<body style="font: 20px sans-serif; margin: 40px">
  <p><a id="glance" href="https://example.com/?glance=1"
        style="display: inline-block; width: 300px; height: 40px">preview me</a></p>
  <p><a id="download" href="data:text/plain,hello" download="hello.txt"
        style="display: inline-block; width: 300px; height: 40px">download me</a></p>
  <p><a id="local" href="glance.html#local"
        style="display: inline-block; width: 300px; height: 40px">a local file</a></p>
</body>
<a id="synth" href="https://example.com/?synth=1">synthesized target</a>
<script>
  // A page faking an Alt+click must not open Glance (or a popup).
  window.fakeAltClick = () => document.getElementById('synth').dispatchEvent(
      new MouseEvent('click', {altKey: true, bubbles: true, cancelable: true}));
</script>
