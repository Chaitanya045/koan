<!doctype html>
<meta charset="utf-8">
<title>Opener</title>
<a id="child" href="tab_management.html?child" target="_blank"
   style="display:block; font-size:48px">Open a child tab</a>
<script>
  // The keys this page receives (the popup test checks Ctrl+Tab gets here).
  window.keys = [];
  addEventListener('keydown', e => {
    if (e.ctrlKey) window.keys.push(e.key);
  });
</script>
